  en: { title: "Article — Phuong Hoang | Electrical Safety News", description: "Read articles from Phuong Hoang about smart electrical safety devices, protection solutions, and the latest technology." },
  zh: { title: "文章详情 — 凤凰科技 | 用电安全资讯", description: "阅读凤凰科技关于智能用电安全设备、保护解决方案和最新技术的文章。" }

  <script>
    (function(){
      var h=document.getElementById('shared-header');
      var f=document.getElementById('shared-footer');
      if(h&&window.__PH_COMPONENTS__&&window.__PH_COMPONENTS__.header){h.innerHTML=window.__PH_COMPONENTS__.header;}
      if(f&&window.__PH_COMPONENTS__&&window.__PH_COMPONENTS__.footer){f.innerHTML=window.__PH_COMPONENTS__.footer;}
    })();

    function renderArticleDetail() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id') || 'news-001';
      var fromPage = params.get('page');
      var fromCat = params.get('category');

      var backLink = document.querySelector('.back-news');
      if (backLink) {
        var bp = new URLSearchParams();
        if (fromPage) bp.set('page', fromPage);
        if (fromCat) bp.set('category', fromCat);
        var bqs = bp.toString();
        backLink.href = 'news.html' + (bqs ? '?' + bqs : '');
      }

      if (!newsArticles || newsArticles.length === 0) {
        loadNewsData(function() { renderArticleDetail(); });
        return;
      }

      var article = null;
      for (var i = 0; i < newsArticles.length; i++) {
        if (newsArticles[i].id === id) { article = newsArticles[i]; break; }
      }

      if (!article) {
        var container = document.getElementById('articleContainer');
        if (container) container.innerHTML = '<p class="ph-fallback-msg">' + getTranslation('page_newsDetail.fallbackMsg') + '</p>';
        var contentDiv = document.querySelector('.article-content');
        if (contentDiv) contentDiv.innerHTML = '';
        return;
      }

      var lang = typeof currentLang !== 'undefined' ? currentLang : 'vi';
      function t(o) { return o && (o[lang] || o.vi || '') || ''; }

      var img = document.getElementById('detailImage');
      var catEl = document.getElementById('detailCategory');
      var dateEl = document.getElementById('detailDate');
      var readEl = document.getElementById('detailReadTime');
      var titleEl = document.getElementById('detailTitle');
      var excerptEl = document.getElementById('detailExcerpt');
      var breadEl = document.getElementById('detailBreadcrumb');

      if (img) { img.src = article.image; img.alt = t(article.title); }
      if (catEl) catEl.textContent = newsCategories[article.category] ? t(newsCategories[article.category]) : '';
      if (dateEl) dateEl.textContent = t(article.date);
      if (readEl) readEl.textContent = t(article.readTime);
      if (titleEl) titleEl.textContent = t(article.title);
      if (excerptEl) excerptEl.textContent = t(article.excerpt);
      if (breadEl) breadEl.textContent = t(article.title);

      var contentDiv = document.getElementById('detailContent');
      var tocDiv = document.getElementById('tocList');

      if (contentDiv && article.sections) {
        var html = '';
        var tocHtml = '';
        for (var s = 0; s < article.sections.length; s++) {
          var sec = article.sections[s];
          var secHeading = sec.heading ? t(sec.heading) : '';
          html += '<h2 id="' + sec.id + '">' + secHeading + '</h2>';
          if (sec.content) html += t(sec.content);
          tocHtml += '<li><a href="#' + sec.id + '">' + secHeading + '</a></li>';
        }

        var safetyTitle = getTranslation('page_newsDetail.safetyNoteTitle');
        var safetyText = getTranslation('page_newsDetail.safetyNoteText');
        html += '<div class="safety-note"><strong>' + safetyTitle + '</strong><p>' + safetyText + '</p></div>';

        if (article.conclusion) {
          var conclusionTitle = getTranslation('page_newsDetail.conclusionTitle');
          html += '<div class="conclusion-box"><h3>' + conclusionTitle + '</h3><p>' + t(article.conclusion) + '</p></div>';
        }

        contentDiv.innerHTML = html;
        if (tocDiv) tocDiv.innerHTML = tocHtml;
      } else if (contentDiv && article.content) {
        contentDiv.innerHTML = t(article.content);
        if (tocDiv) {
          var tocHtml = '';
          var h2s = contentDiv.querySelectorAll('h2');
          for (var h = 0; h < h2s.length; h++) {
            if (!h2s[h].id) h2s[h].id = 'section-' + h;
            tocHtml += '<li><a href="#' + h2s[h].id + '">' + h2s[h].textContent + '</a></li>';
          }
          tocDiv.innerHTML = tocHtml;
        }
      }

      var relatedGrid = document.getElementById('relatedNewsGrid');
      if (relatedGrid) {
        var related = [];
        for (var r = 0; r < newsArticles.length; r++) {
          if (newsArticles[r].id !== article.id && related.length < 4) {
            related.push(newsArticles[r]);
          }
        }
        var relHtml = '';
        for (var r2 = 0; r2 < related.length; r2++) {
          var relUrl = 'news-detail.html?id=' + related[r2].id + (fromPage ? '&page=' + fromPage : '') + (fromCat ? '&category=' + fromCat : '');
          relHtml += '<a class="rel-card" href="' + relUrl + '"><div class="rel-card-img"><img src="' + related[r2].image + '" alt="' + t(related[r2].title) + '" loading="lazy" width="400" height="300"></div><div class="rel-card-body"><h3>' + t(related[r2].title) + '</h3><p>' + t(related[r2].excerpt) + '</p></div></a>';
        }
        relatedGrid.innerHTML = relHtml;
      }

      // Dynamic SEO
      var articleTitle = t(article.title);
      var articleExcerpt = t(article.excerpt);
      var siteUrl = 'https://khktphuonghoang.com';
      var pageUrl = siteUrl + '/news-detail.html?id=' + id;
      var logoUrl = siteUrl + '/assets/logo/Logo.png';

      var seoTitle = articleTitle + ' — Phượng Hoàng | Tin Tức An Toàn Điện';
      document.title = seoTitle;

      var shortDesc = (articleExcerpt || '').replace(/<[^>]*>/g, '').substring(0, 155).trim();
      var metaDescEl = document.querySelector('meta[name="description"]');
      if (metaDescEl && shortDesc) metaDescEl.setAttribute('content', shortDesc);

      var ogTitle = document.querySelector('meta[property="og:title"]');
      if (ogTitle) ogTitle.setAttribute('content', seoTitle);
      var ogDesc = document.querySelector('meta[property="og:description"]');
      if (ogDesc && shortDesc) ogDesc.setAttribute('content', shortDesc);
      var ogImage = document.querySelector('meta[property="og:image"]');
      if (ogImage && article.image) ogImage.setAttribute('content', article.image);
      var ogUrl = document.querySelector('meta[property="og:url"]');
      if (ogUrl) ogUrl.setAttribute('content', pageUrl);

      var twTitle = document.querySelector('meta[name="twitter:title"]');
      if (twTitle) twTitle.setAttribute('content', seoTitle);
      var twDesc = document.querySelector('meta[name="twitter:description"]');
      if (twDesc && shortDesc) twDesc.setAttribute('content', shortDesc);
      var twImage = document.querySelector('meta[name="twitter:image"]');
      if (twImage && article.image) twImage.setAttribute('content', article.image);

      var existingCanonical = document.querySelector('link[rel="canonical"]');
      if (existingCanonical) existingCanonical.setAttribute('href', pageUrl);

      // BlogPosting schema
      var existingSchema = document.getElementById('article-detail-schema');
      if (existingSchema) existingSchema.remove();

      var articleSchema = {
        '@context': 'https://schema.org',
        '@type': 'BlogPosting',
        'headline': articleTitle,
        'description': shortDesc,
        'image': article.image || '',
        'datePublished': (article.date && article.date.vi) ? article.date.vi : '',
        'dateModified': (article.date && article.date.vi) ? article.date.vi : '',
        'author': { '@type': 'Organization', 'name': 'Công ty TNHH Khoa Học Kỹ Thuật Phượng Hoàng', 'url': siteUrl },
        'publisher': { '@type': 'Organization', 'name': 'Phượng Hoàng', 'logo': { '@type': 'ImageObject', 'url': logoUrl } },
        'mainEntityOfPage': { '@type': 'WebPage', '@id': pageUrl }
      };

      var script = document.createElement('script');
      script.type = 'application/ld+json';
      script.id = 'article-detail-schema';
      script.textContent = JSON.stringify(articleSchema);
      document.head.appendChild(script);
    }

    document.addEventListener('DOMContentLoaded', function() {
      if (typeof newsArticles !== 'undefined' && newsArticles.length > 0) {
        renderArticleDetail();
      } else {
        loadNewsData(function() { renderArticleDetail(); });
      }
    });
  </script>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" fill="none">
  <rect width="800" height="300" fill="#101f33"/>
  <!-- Three product silhouettes -->
  <g transform="translate(140,40)">
    <rect x="0" y="20" width="100" height="180" rx="6" fill="#1a2d52" stroke="#203860" stroke-width="1"/>
    <rect x="15" y="40" width="70" height="50" rx="2" fill="#152540" stroke="#1d8b2c" stroke-width="0.5" opacity="0.3"/>
    <rect x="20" y="100" width="60" height="25" rx="3" fill="#0b1929" stroke="#1d8b2c" stroke-width="0.8" opacity="0.4"/>
    <circle cx="50" cy="170" r="8" fill="#10C68D" opacity="0.3"/>
  </g>
  <g transform="translate(350,20)">
    <rect x="0" y="10" width="100" height="200" rx="6" fill="#1a2d52" stroke="#1d8b2c" stroke-width="1.5" opacity="0.7"/>
    <rect x="15" y="30" width="70" height="60" rx="2" fill="#152540" stroke="#1d8b2c" stroke-width="0.5" opacity="0.35"/>
    <rect x="20" y="105" width="60" height="30" rx="3" fill="#0b1929" stroke="#1d8b2c" stroke-width="0.8" opacity="0.45"/>
    <circle cx="50" cy="175" r="8" fill="#10C68D" opacity="0.35"/>
  </g>
  <g transform="translate(560,60)">
    <rect x="0" y="20" width="100" height="160" rx="6" fill="#1a2d52" stroke="#203860" stroke-width="1"/>
    <rect x="15" y="40" width="70" height="45" rx="2" fill="#152540" stroke="#1d8b2c" stroke-width="0.5" opacity="0.25"/>
    <rect x="20" y="95" width="60" height="22" rx="3" fill="#0b1929" stroke="#1d8b2c" stroke-width="0.8" opacity="0.35"/>
    <circle cx="50" cy="150" r="8" fill="#10C68D" opacity="0.25"/>
  </g>
  <!-- Connecting lines (electrical bus) -->
  <line x1="240" y1="240" x2="350" y2="230" stroke="#94A6BE" stroke-width="0.5" opacity="0.15" stroke-dasharray="4 4"/>
  <line x1="450" y1="230" x2="560" y2="240" stroke="#94A6BE" stroke-width="0.5" opacity="0.15" stroke-dasharray="4 4"/>
  <!-- Label -->
  <text x="400" y="285" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5B7191" opacity="0.5">PLACEHOLDER: thay bằng ảnh thực tế</text>
</svg>

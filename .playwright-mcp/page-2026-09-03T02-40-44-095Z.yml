          - paragraph [ref=f899e81]: "Trở thành doanh nghiệp tiên phong trong lĩnh vực thiết bị điện an toàn thông minh tại Việt Nam, mang đến giải pháp bảo vệ toàn diện cho mọi công trình: từ hộ gia đình đến nhà máy công nghiệp."
        - generic [ref=f899e82]:
          - heading "Sứ mệnh" [level=3] [ref=f899e83]
          - paragraph [ref=f899e84]: Nghiên cứu, phát triển và cung cấp các giải pháp an toàn điện thông minh, giúp người dùng giám sát và điều khiển hệ thống điện từ xa, ngăn chặn sự cố trước khi gây hậu quả nghiêm trọng.

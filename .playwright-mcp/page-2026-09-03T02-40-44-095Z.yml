    - generic [ref=f899e56]:
      - generic [ref=f899e57]:
        - generic [ref=f899e58]:
          - generic [ref=f899e59]: Thư ngỏ
          - heading "Về Phượng Hoàng" [level=1] [ref=f899e60]
        - generic [ref=f899e61]:
          - paragraph [ref=f899e62]: Kính gửi Quý khách hàng và đối tác,
          - paragraph [ref=f899e63]: Công ty TNHH Khoa Học Kỹ Thuật Phượng Hoàng chuyên nghiên cứu, phát triển và chuyển giao các giải pháp, thiết bị điện an toàn thông minh trên nền tảng khoa học công nghệ tiên tiến.
          - paragraph [ref=f899e64]: Trong đời sống, sản xuất và kinh doanh, các sự cố như rò điện, chập cháy, quá tải hay hồ quang điện luôn tiềm ẩn nguy cơ đe dọa trực tiếp đến tính mạng con người và gây thiệt hại nghiêm trọng về tài sản. Phượng Hoàng ra đời từ nhu cầu cấp thiết đó, với định hướng chủ động phát hiện, kiểm soát và ngăn ngừa rủi ro điện trước khi sự cố xảy ra.
          - paragraph [ref=f899e65]: Chúng tôi phát triển các giải pháp giám sát và bảo vệ điện thông minh, giúp phát hiện sớm nguy cơ, cô lập sự cố kịp thời và nâng cao hiệu quả quản lý, vận hành hệ thống điện. Bằng năng lực công nghệ, tinh thần trách nhiệm và định hướng phát triển bền vững, Phượng Hoàng mong muốn đồng hành cùng doanh nghiệp, nhà máy, cơ sở sản xuất và các hộ gia đình. Mục tiêu chung là xây dựng một môi trường sử dụng điện an toàn, chủ động và hiệu quả.
          - generic [ref=f899e66]:
            - paragraph [ref=f899e67]: Sứ mệnh của chúng tôi
            - paragraph [ref=f899e68]: Mang điện an toàn đến nhân loại.
        - generic [ref=f899e69]:
          - paragraph [ref=f899e70]: Trân trọng,
          - paragraph [ref=f899e71]: Công ty TNHH Khoa Học Kỹ Thuật Phượng Hoàng

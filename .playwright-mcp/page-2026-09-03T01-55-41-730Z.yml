      - tablist "Frequently Asked Questions" [ref=f348e510]:
        - generic [ref=f348e335]:
          - tab "How does the device work? What electrical risks does it protect against?" [selected] [ref=f348e511] [cursor=pointer]
          - tabpanel "How does the device work? What electrical risks does it protect against?" [ref=f348e512]:
            - paragraph [ref=f348e340]: The device continuously monitors current flow in your electrical system, detecting anomalies such as leakage, overload, overheating, and arc faults. When a risk is detected, it automatically cuts off the circuit before the incident develops into a fire or electrical accident.
        - generic [ref=f348e341]:
          - tab "Is the device compatible with existing 220V/380V electrical systems?" [ref=f348e513] [cursor=pointer]
          - tabpanel "Is the device compatible with existing 220V/380V electrical systems?":
            - paragraph [ref=f348e345]: Yes. Phuong Hoang offers product lines for both single-phase 220V (residential) and three-phase 380V (commercial, industrial) systems. Devices are designed to integrate into existing distribution panels without major modifications.
        - generic [ref=f348e346]:
          - tab "Is installation complicated? Does it require rewiring?" [ref=f348e514] [cursor=pointer]
          - tabpanel "Is installation complicated? Does it require rewiring?":
            - paragraph [ref=f348e350]: No rewiring required. Our technical team visits your site for assessment and installs the device into your existing distribution panel. The process is typically quick, with no disruption to daily life or operations.
        - generic [ref=f348e351]:
          - tab "How do I choose the right model and capacity for my project?" [ref=f348e515] [cursor=pointer]
          - tabpanel "How do I choose the right model and capacity for my project?":
            - paragraph [ref=f348e355]: "We offer free site surveys. A technician will assess your project size, type, and electrical load to recommend the most suitable solution: residential, commercial, or industrial."
        - generic [ref=f348e356]:
          - tab "What warranty and technical support policies are provided?" [ref=f348e516] [cursor=pointer]
          - tabpanel "What warranty and technical support policies are provided?":
            - paragraph [ref=f348e360]: Products carry a 36-month warranty depending on the series, covering manufacturer technical defects. Ongoing technical support is available via the hotline 1800 888 638 throughout your usage period.
        - generic [ref=f348e361]:
          - tab "Can I get a survey and consultation before purchasing?" [ref=f348e517] [cursor=pointer]
          - tabpanel "Can I get a survey and consultation before purchasing?":
            - paragraph [ref=f348e365]: Yes. Call 1800 888 638 or leave your details, we will visit your site for a free survey, recommend suitable options, and provide a quote. No purchase pressure.
      - link "Still have questions? Contact us →" [ref=f348e518] [cursor=pointer]:
        - /url: contact.html

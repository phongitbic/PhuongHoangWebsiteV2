            - generic [ref=f875e248]: ▼
          - generic [ref=f875e250]:
            - paragraph [ref=f875e251]: 享受免费保修服务需满足以下条件：（1）产品仍在保修期内，保修标签和保修卡完好无损；（2）故障属于制造缺陷，非外部因素造成；（3）您能提供有效的购买信息。因使用不当、未经授权的维修或自然灾害造成的损坏不在免费保修范围内。

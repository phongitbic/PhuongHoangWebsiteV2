      - generic [ref=f875e203]:
        - generic [ref=f875e204]:
          - button "Q 电涌保护器如何保护我的电气设备？ ▼" [ref=f875e205] [cursor=pointer]:
            - generic [ref=f875e206]: Q
            - generic [ref=f875e207]: 电涌保护器如何保护我的电气设备？
            - generic [ref=f875e208]: ▼
          - generic [ref=f875e210]:
            - paragraph [ref=f875e211]: 凤凰科技的电涌保护器（SPD）如同防护盾牌。当出现突然的电压尖峰（由雷击或设备开关引起）时，SPD会迅速将电涌电流导向大地，阻止高电压进入您的电气设备。这样可以保护电视、冰箱、电脑和工业机械免受过压损坏。
            - paragraph [ref=f875e212]:
              - link "查看电涌保护器 →" [ref=f875e213] [cursor=pointer]:
                - /url: products.html?category=surge
        - generic [ref=f875e214]:
          - button "Q 凤凰科技有哪些产品类别？ ▼" [ref=f875e215] [cursor=pointer]:
            - generic [ref=f875e216]: Q
            - generic [ref=f875e217]: 凤凰科技有哪些产品类别？
            - generic [ref=f875e218]: ▼
          - generic [ref=f875e220]:
            - paragraph [ref=f875e221]: 凤凰科技提供三大类智能用电安全设备：（1）工业设备，适用于工厂和工业园区；（2）民用设备，为家庭提供用电安全保护；（3）隔离电涌保护，防止因接触漏电设备而触电。
            - paragraph [ref=f875e222]:
              - link "查看完整产品目录 →" [ref=f875e223] [cursor=pointer]:
                - /url: products.html
        - generic [ref=f875e224]:
          - button "Q 工业用电安全设备与家用设备有什么不同？ ▼" [ref=f875e225] [cursor=pointer]:
            - generic [ref=f875e226]: Q
            - generic [ref=f875e227]: 工业用电安全设备与家用设备有什么不同？
            - generic [ref=f875e228]: ▼
          - generic [ref=f875e230]:
            - paragraph [ref=f875e231]: 凤凰科技的工业设备设计用于承受更大负载，在恶劣环境（高温、粉尘、振动）下连续运行，通常还集成远程监控功能。民用设备注重安装简便、结构紧凑，保护标准家用电器。两类产品均符合电气安全标准，在交付前经过质量检测。
            - paragraph [ref=f875e232]:
              - link "浏览工业与民用设备 →" [ref=f875e233] [cursor=pointer]:
                - /url: products.html
        - generic [ref=f875e234]:
          - button "Q 凤凰科技设备的保修期是多长？ ▼" [ref=f875e235] [cursor=pointer]:
            - generic [ref=f875e236]: Q
            - generic [ref=f875e237]: 凤凰科技设备的保修期是多长？
            - generic [ref=f875e238]: ▼
          - generic [ref=f875e240]:
            - paragraph [ref=f875e241]: 凤凰科技的标准保修期为12至24个月，具体取决于产品线。保修期从交货日期或项目验收日期开始计算。部分产品线还可根据合同约定提供延长保修服务。
            - paragraph [ref=f875e242]:

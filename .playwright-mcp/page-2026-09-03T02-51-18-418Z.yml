            - generic [ref=f933e188]:
              - heading "Hướng dẫn chi tiết cách xử lý sự cố điện một cách an toàn trong gia đình" [level=3] [ref=f933e189]
              - paragraph [ref=f933e190]: "Hướng dẫn toàn diện về cách nhận biết và xử lý an toàn các sự cố điện thường gặp trong gia đình: từ mất điện, nhảy aptomat, chập điện, mùi khét đến thiết bị hoạt động bất thường. Bài viết phân định rõ ràng giữa những việc người dùng có thể tự kiểm tra an toàn và những tình huống bắt buộc phải gọi thợ điện chuyên nghiệp, giúp bạn bảo vệ bản thân và gia đình."
          - link [ref=f933e191] [cursor=pointer]:
            - /url: news-detail.html?id=news-013&page=1&category=all
            - img "Cách bảo vệ hệ thống điện trước sự cố chập cháy" [ref=f933e193]
            - generic [ref=f933e194]:
              - heading "Cách bảo vệ hệ thống điện trước sự cố chập cháy" [level=3] [ref=f933e195]
              - paragraph [ref=f933e196]: "Hướng dẫn toàn diện về các biện pháp bảo vệ hệ thống điện khỏi nguy cơ chập cháy: từ việc lựa chọn thiết bị bảo vệ phù hợp (MCB, RCD, AFDD), kiểm tra và bảo trì định kỳ, đến phát hiện sớm các dấu hiệu nguy hiểm. Bài viết phân tích các nguyên nhân gây chập cháy phổ biến nhất và giải pháp phòng ngừa dựa trên tiêu chuẩn TCVN và IEC, giúp bảo vệ an toàn cho ngôi nhà và người thân của bạn."
          - link [ref=f933e197] [cursor=pointer]:

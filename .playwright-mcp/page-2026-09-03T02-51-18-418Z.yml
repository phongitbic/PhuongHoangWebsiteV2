                - link "Sự khác biệt với thiết bị bảo vệ truyền thống" [ref=f933e157] [cursor=pointer]:
                  - /url: "#smart-vs-traditional"
              - listitem [ref=f933e158]:
                - link "Nguyên lý hoạt động chi tiết" [ref=f933e159] [cursor=pointer]:
                  - /url: "#smart-principle"
              - listitem [ref=f933e160]:
                - link "Lợi ích thiết thực cho hộ gia đình" [ref=f933e161] [cursor=pointer]:

              - paragraph [ref=f933e202]: Hướng dẫn chi tiết về việc sử dụng an toàn thiết bị điện trong các môi trường ẩm ướt như phòng tắm, nhà bếp, khu giặt là, và không gian ngoài trời. Bài viết giải thích ý nghĩa của chỉ số IP (Ingress Protection), các quy định về vùng an toàn điện trong phòng tắm theo TCVN 7447, và các biện pháp bảo vệ thiết thực giúp ngăn ngừa tai nạn điện trong môi trường có nước và độ ẩm cao.
